# cbindgen configuration for sonora C API header generation.
#
# Run manually: cbindgen --config cbindgen.toml --crate sonora-ffi --output include/wap_audio_processing.h
# Automatic: build.rs invokes cbindgen on every build.

autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not edit. */"
cpp_compat      = true
include_guard   = "WAP_AUDIO_PROCESSING_H"
language        = "C"
no_includes     = true
style           = "both"
sys_includes    = ["stdint.h", "stdbool.h", "stddef.h"]

[parse]
parse_deps = false

[export]
include = [
  "WapError",
  "WapNoiseSuppressionLevel",
  "WapDownmixMethod",
  "WapConfig",
  "WapStreamConfig",
  "WapStats",
  "WapAudioProcessing",
]
prefix = ""

[fn]
prefix = ""
